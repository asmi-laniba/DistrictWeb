{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login | Smart District+{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4 shadow-lg border-0">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-lock text-primary fs-1 mb-3"></i>
                    <h3 class="fw-bold">Welcome Back</h3>
                    <p class="text-muted">Sign in to access the government dashboard.</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>
                </form>
                <div class="text-center mt-4 pt-3 border-top">
                    <small class="text-muted">Need a citizen account? <a href="{% url 'register' %}"
                            class="fw-bold text-decoration-none">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
